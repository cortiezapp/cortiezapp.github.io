<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CortiezSensiX</title>

<style>
@font-face {
  font-family: "GFFLatin";
  src: url("https://cortiezapp.github.io/fonts/GFF-Latin-Regular.woff2") format("woff2");
}
@font-face {
  font-family: "GFFLatin";
  src: url("https://cortiezapp.github.io/fonts/GFF-Latin-Medium.woff2") format("woff2");
}
@font-face {
  font-family: "GFFLatin";
  src: url("https://cortiezapp.github.io/fonts/GFF-Latin-Bold.woff2") format("woff2");
}

:root{
  --card:rgba(255,255,255,.04);
  --border:rgba(255,255,255,.08);
  --text:#e6eef6;
  --muted:#9aa4b2;
  --accent:#38bdf8;
  --accent2:#7c3aed;
  --success:#00e676;
  font-family:"GFFLatin",sans-serif;
}

body{
  margin:0;
  min-height:100vh;
  background:linear-gradient(180deg,#071022,#081228);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:16px;
  color:var(--text);
}

.container{
  width:100%;
  max-width:420px;
  background:var(--card);
  border:1px solid var(--border);
  border-radius:18px;
  padding:20px;
  text-align:center;
}

.verify-btn{
  width:100%;
  height:52px;
  border-radius:30px;
  border:none;
  font-weight:700;
  background:linear-gradient(90deg,var(--accent),var(--accent2));
  color:#012;
  cursor:pointer;
  margin:22px 0;
}
.verify-btn:disabled{opacity:.6}
.verify-btn.done{background:#00c853}

.btn-action{
  margin-top:12px;
  padding:12px 22px;
  border-radius:30px;
  border:none;
  font-weight:700;
  background:linear-gradient(90deg,var(--accent),var(--accent2));
  color:#012;
  cursor:pointer;
}

#result,#copyResult,#openApp{
  display:none;
}

#copyResult{
  margin-top:10px;
  color:var(--success);
  word-break:break-all;
}
</style>
</head>

<body>

<div class="container">
  <h1>Cortiez<span style="color:var(--accent)">SensiX</span></h1>
  <p id="verifyText">Tap to verify (1/3)</p>

  <button class="verify-btn" id="verifyBtn">
    Verification 1/3
  </button>

  <div id="result">Password generated successfully!</div>

  <button id="btnCopy" class="btn-action" style="display:none" onclick="copyPassword()">
    Copy Password
  </button>

  <div id="copyResult">
    <div>Password copied!</div>
    <div><b>KEY:</b> <span id="copiedKey"></span></div>
  </div>

  <a id="openApp" class="btn-action"
     href="intent://open#Intent;scheme=myapp;package=com.ic.cortiez;S.browser_fallback_url=https://cortiezapp.github.io/;end">
     Open App
  </a>
</div>

<script>
let currentPassword="", passwordReady=false;
let step=1, locked=false;

const texts=[
  "Human check required",
  "Confirm you are real",
  "Final verification step"
];

function vibrate(ms){
  try{ navigator.vibrate && navigator.vibrate(ms); }catch(e){}
}

function generatePassword(){
  const id=new URLSearchParams(location.search).get("id");
  if(!id) return;
  const base="Cyrust21"+id+new Date().getHours();
  crypto.subtle.digest("SHA-256",new TextEncoder().encode(base))
  .then(h=>{
    const c="ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789@#$";
    currentPassword=[...new Uint8Array(h)].slice(0,10)
      .map(b=>c[b%c.length]).join("");
    passwordReady=true;
  });
}

verifyBtn.onclick=()=>{
  if(!passwordReady || locked || step>=3) return;

  locked=true;
  verifyBtn.disabled=true;
  vibrate(40);

  setTimeout(()=>{
    step++;
    locked=false;
    verifyBtn.disabled=false;

    verifyBtn.textContent=`Verification ${step}/3`;
    verifyText.textContent =
      `${texts[Math.floor(Math.random()*texts.length)]} (${step}/3)`;

    if(step>=3){
      vibrate([60,40,60]);
      verifyBtn.textContent="Verified ✓";
      verifyBtn.classList.add("done");
      verifyBtn.disabled=true;
      result.style.display="block";
      btnCopy.style.display="block";
    }
  },1200);
};

function copyPassword(){
  navigator.clipboard.writeText(currentPassword).then(()=>{
    vibrate(80);
    copiedKey.textContent=currentPassword;
    copyResult.style.display="block";
    openApp.style.display="inline-block";
    btnCopy.style.display="none";
  });
}

document.addEventListener("DOMContentLoaded",generatePassword);
</script>

</body>
</html>
