<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CortiezSensiX</title>

<style>
@font-face {
  font-family: "GFFLatin";
  src: url("https://cortiezapp.github.io/fonts/GFF-Latin-Regular.woff2") format("woff2");
}
@font-face {
  font-family: "GFFLatin";
  src: url("https://cortiezapp.github.io/fonts/GFF-Latin-Bold.woff2") format("woff2");
}

:root{
  --card:rgba(255,255,255,.05);
  --border:rgba(255,255,255,.1);
  --text:#e6eef6;
  --muted:#9aa4b2;
  --accent:#38bdf8;
  --accent2:#7c3aed;
  --success:#00e676;
  font-family:"GFFLatin",sans-serif;
}

body{
  margin:0;
  min-height:100vh;
  background:linear-gradient(180deg,#071022,#081228);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:16px;
  color:var(--text);
}

.container{
  width:100%;
  max-width:420px;
  background:var(--card);
  border:1px solid var(--border);
  border-radius:18px;
  padding:22px;
  text-align:center;
}

.verify-btn,.btn-action{
  width:100%;
  height:52px;
  border-radius:30px;
  border:none;
  font-weight:700;
  background:linear-gradient(90deg,var(--accent),var(--accent2));
  color:#012;
  cursor:pointer;
  margin-top:16px;
}

.verify-btn:disabled,
.btn-action:disabled{
  opacity:.6;
  cursor:not-allowed;
}

.verify-btn.done{
  background:#00c853;
}

#result{
  display:none;
  margin-top:16px;
  font-weight:700;
}

#copyResult{
  display:none;
  margin-top:16px;
  color:var(--success);
  text-align:center;
  background:rgba(0,0,0,.35);
  padding:14px;
  border-radius:14px;
  border:1px solid var(--border);
  word-break:break-all;
}

#openApp{
  display:none;
  margin-top:14px;
  text-decoration:none;
  display:block;
}

#safelinkBox{
  display:none;
  margin-top:18px;
}
</style>
</head>

<body>

<div class="container">
  <h1>Cortiez<span style="color:var(--accent)">SensiX</span></h1>

  <p id="verifyText">Tap to verify (1/3)</p>

  <button class="verify-btn" id="verifyBtn">
    Verification 1/3
  </button>

  <!-- Safelink -->
  <div id="safelinkBox">
    <p id="countText">Please wait...</p>
    <button id="unlockBtn" class="btn-action" disabled>
      Unlock Link
    </button>
  </div>

  <div id="result">Password generated successfully!</div>

  <button id="btnCopy" class="btn-action" style="display:none">
    Copy Password
  </button>

  <div id="copyResult">
    <div>Password copied!</div>
    <div><b>KEY:</b> <span id="copiedKey"></span></div>
  </div>

  <a id="openApp" class="btn-action"
     href="intent://open#Intent;scheme=myapp;package=com.ic.cortiez;S.browser_fallback_url=https://cortiezapp.github.io/;end">
     Open App
  </a>
</div>

<script>
let currentPassword="";
let passwordReady=false;
let step=1;
let locked=false;

const texts=[
  "Human check required",
  "Confirm you are real",
  "Final verification step"
];

function vibrate(ms){
  try{ navigator.vibrate && navigator.vibrate(ms); }catch(e){}
}

function generatePassword(){
  const id=new URLSearchParams(location.search).get("id");
  if(!id) return;

  const base="Cyrust21"+id+new Date().getHours();
  crypto.subtle.digest("SHA-256",new TextEncoder().encode(base))
  .then(h=>{
    const chars="ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789@#$";
    currentPassword=[...new Uint8Array(h)]
      .slice(0,10)
      .map(b=>chars[b%chars.length])
      .join("");
    passwordReady=true;
  });
}

verifyBtn.onclick=()=>{
  if(!passwordReady || locked || step>=3) return;

  locked=true;
  verifyBtn.disabled=true;
  vibrate(40);

  setTimeout(()=>{
    step++;
    locked=false;
    verifyBtn.disabled=false;

    verifyBtn.textContent=`Verification ${step}/3`;
    verifyText.textContent=
      `${texts[Math.floor(Math.random()*texts.length)]} (${step}/3)`;

    if(step>=3){
      verifyBtn.textContent="Verified ✓";
      verifyBtn.classList.add("done");
      verifyBtn.disabled=true;
      verifyText.textContent="Verification complete";

      safelinkBox.style.display="block";

      let time=15;
      countText.textContent=`Unlocking in ${time}s`;

      const timer=setInterval(()=>{
        time--;
        countText.textContent=`Unlocking in ${time}s`;
        if(time<=0){
          clearInterval(timer);
          countText.textContent="Unlocked ✓";
          unlockBtn.disabled=false;
        }
      },1000);
    }
  },1200);
};

unlockBtn.onclick=()=>{
  safelinkBox.style.display="none";
  result.style.display="block";
  btnCopy.style.display="block";
};

btnCopy.onclick=()=>{
  navigator.clipboard.writeText(currentPassword).then(()=>{
    vibrate(80);
    copiedKey.textContent=currentPassword;
    copyResult.style.display="block";
    openApp.style.display="block";
    btnCopy.style.display="none";
  });
};

document.addEventListener("DOMContentLoaded",generatePassword);
</script>

</body>
</html>
