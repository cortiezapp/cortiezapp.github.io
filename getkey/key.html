<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CortiezSensiX</title>

<style>
@font-face {
  font-family: "GFFLatin";
  src: url("https://cortiezapp.github.io/fonts/GFF-Latin-Regular.woff2") format("woff2");
  font-weight: 400;
}
@font-face {
  font-family: "GFFLatin";
  src: url("https://cortiezapp.github.io/fonts/GFF-Latin-Medium.woff2") format("woff2");
  font-weight: 500;
}
@font-face {
  font-family: "GFFLatin";
  src: url("https://cortiezapp.github.io/fonts/GFF-Latin-Bold.woff2") format("woff2");
  font-weight: 700;
}

:root{
  --card: rgba(255,255,255,.04);
  --border: rgba(255,255,255,.08);
  --text: #e6eef6;
  --muted: #9aa4b2;
  --accent: #38bdf8;
  --accent2: #7c3aed;
  --success: #00e676;
  font-family:"GFFLatin",sans-serif;
}

body{
  margin:0;
  min-height:100vh;
  background:linear-gradient(180deg,#071022,#081228);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:16px;
  color:var(--text);
}

.container{
  width:100%;
  max-width:420px;
  background:var(--card);
  border:1px solid var(--border);
  border-radius:18px;
  padding:20px;
  text-align:center;
  box-shadow:0 10px 28px rgba(0,0,0,.6);
}

.verify-btn{
  width:100%;
  height:52px;
  border-radius:30px;
  border:none;
  font-weight:700;
  background:linear-gradient(90deg,var(--accent),var(--accent2));
  color:#012;
  cursor:pointer;
  margin:26px 0;
  transition:.25s;
}
.verify-btn:disabled{
  opacity:.6;
  cursor:not-allowed;
}
.verify-btn.done{
  background:#00c853;
}

#result{display:none;color:var(--success)}
#btnCopy{display:none}
.btn-action{
  margin-top:14px;
  padding:12px 22px;
  border-radius:30px;
  border:none;
  font-weight:700;
  background:linear-gradient(90deg,var(--accent),var(--accent2));
  cursor:pointer;
}

#dialog{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.85);
  align-items:center;
  justify-content:center;
}
.box{
  width:90%;
  max-width:360px;
  background:var(--card);
  border:1px solid var(--border);
  border-radius:16px;
  padding:18px;
  text-align:center;
}
</style>
</head>

<body>

<div class="container">
  <h1>Cortiez<span style="color:var(--accent)">SensiX</span></h1>
  <p id="verifyText">Tap to verify (1/3)</p>

  <button class="verify-btn" id="verifyBtn">
    Verification 1/3
  </button>

  <div id="result">Password generated successfully!</div>

  <div id="btnCopy">
    <button class="btn-action" onclick="copyPassword()">Copy Password</button>
  </div>
</div>

<div id="dialog">
  <div class="box">
    <h3>Password copied!</h3>
    <p><b id="copiedKey"></b></p>
  </div>
</div>

<script>
let currentPassword="", passwordReady=false;
let step=1, locked=false;

const texts=[
  "Human check required",
  "Confirm you are real",
  "Final verification step"
];

function vibrate(ms){
  if(navigator.vibrate) navigator.vibrate(ms);
}

function generatePassword(){
  const id=new URLSearchParams(location.search).get("id");
  if(!id) return;
  const base="Cyrust21"+id+new Date().getHours();
  crypto.subtle.digest("SHA-256",new TextEncoder().encode(base))
  .then(h=>{
    const c="ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789@#$";
    currentPassword=[...new Uint8Array(h)].slice(0,10)
      .map(b=>c[b%c.length]).join("");
    passwordReady=true;
  });
}

verifyBtn.onclick=()=>{
  if(!passwordReady || locked || step>=3) return;

  locked=true;
  verifyBtn.disabled=true;
  vibrate(40);

  setTimeout(()=>{
    step++;
    verifyBtn.disabled=false;
    locked=false;

    verifyBtn.textContent=`Verification ${step}/3`;
    verifyText.textContent=texts[Math.floor(Math.random()*texts.length)];

    if(step>=3){
      vibrate([60,40,60]);
      verifyBtn.textContent="Verified ✓";
      verifyBtn.classList.add("done");
      verifyBtn.disabled=true;
      result.style.display="block";
      btnCopy.style.display="block";
    }
  },1200); // ⏱ delay antar tap
};

function copyPassword(){
  navigator.clipboard.writeText(currentPassword).then(()=>{
    copiedKey.textContent=currentPassword;
    dialog.style.display="flex";
  });
}

document.addEventListener("DOMContentLoaded",generatePassword);
</script>

</body>
</html>
