<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verifikasi License Cortiez</title>
<style>
body { font-family: Arial,sans-serif; background:#0f172a; color:#fff; display:flex; justify-content:center; align-items:center; height:100vh; margin:0; }
.card { background:#020617; padding:24px; border-radius:12px; width:100%; max-width:360px; text-align:center; box-shadow:0 10px 25px rgba(0,0,0,.4); }
input { width:100%; padding:10px; margin:10px 0; border-radius:6px; border:none; font-size:16px; }
button { width:100%; padding:12px; border:none; border-radius:8px; font-size:16px; cursor:pointer; background:#22c55e; color:#000; }
button:disabled { background:#555; cursor:not-allowed; }
.small { font-size:12px; color:#94a3b8; margin-top:8px; min-height:18px; }
</style>
</head>
<body>
<div class="card">
<h2>🔐 Verifikasi License</h2>
<input id="licenseKey" placeholder="Masukkan license key">
<button id="verifyBtn">Verifikasi & Buka App</button>
<div class="small" id="status"></div>
</div>

<script>
const btn = document.getElementById("verifyBtn");
const status = document.getElementById("status");
const input = document.getElementById("licenseKey");

const WORKER = "https://cortiez-license.cyrustmods21.workers.dev";

btn.onclick = async () => {
    const key = input.value.trim();
    if(!key) { status.innerText="Masukkan license key"; return; }

    btn.disabled = true;
    status.innerText = "Memverifikasi…";

    try {
        const res = await fetch(`${WORKER}/verify?key=${encodeURIComponent(key)}`);
        const json = await res.json();
        if(!json.ok){ status.innerText="❌ License tidak valid"; btn.disabled=false; return; }

        // register device
        const androidId = "android_id_hash_example"; // ganti sesuai androidId di app
        await fetch(`${WORKER}/register?h=${encodeURIComponent(androidId)}`);

        status.innerText = "✅ Berhasil! Membuka app…";
        setTimeout(()=>{ location.href=`myapp://open?ok=1&h=${androidId}` }, 800);

    } catch(e){
        status.innerText="❌ Gagal koneksi server";
        btn.disabled=false;
    }
};
</script>
</body>
</html>
