<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Device Verification</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
:root {
  --bg: #020617;
  --card: #020617;
  --accent: #22c55e;
  --text: #e5e7eb;
  --muted: #94a3b8;
  --danger: #ef4444;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  height: 100vh;
  background: radial-gradient(circle at top, #020617, #000);
  display: flex;
  justify-content: center;
  align-items: center;
  font-family: system-ui, -apple-system, BlinkMacSystemFont;
  color: var(--text);
}

.card {
  width: 100%;
  max-width: 380px;
  background: rgba(2,6,23,.85);
  backdrop-filter: blur(12px);
  border-radius: 16px;
  padding: 26px;
  box-shadow: 0 25px 60px rgba(0,0,0,.55);
  text-align: center;
}

h2 {
  margin: 0 0 6px;
  font-size: 22px;
}

p {
  margin: 0;
  font-size: 14px;
  color: var(--muted);
}

.timer {
  font-size: 30px;
  font-weight: 700;
  margin: 18px 0 6px;
  letter-spacing: 1px;
}

.status {
  min-height: 20px;
  font-size: 13px;
  color: var(--muted);
}

button {
  margin-top: 18px;
  width: 100%;
  padding: 14px;
  font-size: 16px;
  font-weight: 600;
  border-radius: 12px;
  border: none;
  background: linear-gradient(135deg, #22c55e, #16a34a);
  color: #000;
  cursor: pointer;
  transition: transform .15s, opacity .15s;
}

button:active { transform: scale(.98); }
button:disabled {
  opacity: .45;
  cursor: not-allowed;
}

.footer {
  margin-top: 16px;
  font-size: 11px;
  color: #64748b;
}
</style>
</head>

<body>

<div class="card">
  <h2>Verifikasi Perangkat</h2>
  <p>Aktifkan fitur aplikasi pada device ini</p>

  <div class="timer" id="timer">--:--</div>
  <div class="status" id="status">Menghubungkan server…</div>

  <button id="verifyBtn" disabled>Aktifkan Sekarang</button>

  <div class="footer">
    License terikat ke perangkat
  </div>
</div>

<script>
const params = new URLSearchParams(location.search);
const hash = params.get("h");
if (!hash) {
  document.body.innerHTML = "Invalid request";
  throw "";
}

const WORKER = "https://cortiezapp.cyrustmods21.workers.dev";

const btn = document.getElementById("verifyBtn");
const status = document.getElementById("status");
const timer = document.getElementById("timer");

fetch(`${WORKER}/create?h=${encodeURIComponent(hash)}`)
.then(r => r.json())
.then(d => {

  const token = d.token;
  const expire = d.expire * 1000;
  const offset = Date.now() - (d.server_time * 1000);

  function tick() {
    const left = expire - (Date.now() - offset);
    if (left <= 0) {
      timer.textContent = "00:00";
      status.textContent = "License expired";
      btn.disabled = true;
      return;
    }

    const s = Math.floor(left / 1000);
    const h = Math.floor(s / 3600);
    const m = Math.floor((s % 3600) / 60);

    timer.textContent =
      `${h.toString().padStart(2,"0")}:${m.toString().padStart(2,"0")}`;

    status.textContent = "License masih aktif";
    btn.disabled = false;
  }

  tick();
  setInterval(tick, 1000);

  btn.onclick = async () => {
    btn.disabled = true;
    status.textContent = "Memverifikasi…";

    const res = await fetch(
      `${WORKER}/verify?t=${encodeURIComponent(token)}&h=${encodeURIComponent(hash)}`
    );
    const json = await res.json();

    if (!json.ok) {
      status.textContent = "License tidak valid / diganti admin";
      return;
    }

    status.textContent = "Berhasil, membuka aplikasi…";

    location.href =
      `myapp://open?ok=1&t=${token}&h=${hash}`;
  };
})
.catch(() => {
  status.textContent = "Gagal terhubung ke server";
});
</script>

</body>
</html>
