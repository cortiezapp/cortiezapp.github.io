<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verifikasi Cortiez</title>
</head>
<body>
<script>
(async function(){
    // Ambil parameter dari URL
    const params = new URLSearchParams(window.location.search);
    const h = params.get("h"); // Android ID
    if(!h) {
        document.body.innerText = "Parameter h dibutuhkan!";
        return;
    }

    // Ambil server time dari GitHub Pages
    const timeResp = await fetch("https://cortiezapp.github.io/time/index.html");
    const timeJson = await timeResp.json();
    const serverTime = timeJson.timestamp;

    // Hitung expire 2 jam dari serverTime
    const expire = serverTime + 2*3600*1000;

    // Hash SHA-256(h + expire)
    async function sha256(str) {
        const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(str));
        return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,'0')).join('');
    }

    const hash = await sha256(h + expire);

    // Redirect ke app dengan param
    const intentUrl = cortiez://verification?ok=1&h=${encodeURIComponent(h)}&expire=${expire}&hash=${hash};
    document.body.innerText = "Verifikasi berhasil! Mengarahkan ke app...";
    window.location.href = intentUrl;
})();
</script>
</body>
</html>
