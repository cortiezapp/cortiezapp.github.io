<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Verifikasi Perangkat</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body{font-family:Arial,sans-serif;background:#0f172a;color:#fff;display:flex;justify-content:center;align-items:center;height:100vh;margin:0}
.card{background:#020617;padding:24px;border-radius:12px;width:100%;max-width:360px;text-align:center;box-shadow:0 10px 25px rgba(0,0,0,.4)}
button{background:#22c55e;border:none;color:#000;padding:12px 16px;border-radius:8px;font-size:16px;cursor:pointer;width:100%;margin-top:16px}
button:disabled{background:#555;cursor:not-allowed}
.small{font-size:12px;color:#94a3b8;margin-top:12px;min-height:18px}
</style>
</head>
<body>
<div class="card">
<h2>🔐 Verifikasi Perangkat</h2>
<p>Aktifkan fitur aplikasi di perangkat ini.</p>
<button id="verifyBtn" disabled>Verifikasi & Aktifkan</button>
<div class="small" id="status">Memuat data verifikasi…</div>
</div>

<script>
const params = new URLSearchParams(location.search);
const hash = params.get("h");
if(!hash){document.body.innerHTML="Invalid request";throw"";}

const WORKER = "https://cortiez-license.cyrustmods21.workers.dev";
const btn = document.getElementById("verifyBtn");
const status = document.getElementById("status");

fetch(`${WORKER}/create?h=${encodeURIComponent(hash)}`)
.then(r=>r.json())
.then(d=>{
  const token = d.token;
  btn.disabled=false;
  btn.onclick=()=>{
    fetch(`${WORKER}/verify?t=${token}&h=${hash}`)
    .then(r=>r.json())
    .then(j=>{
      if(!j.ok){status.innerText="❌ Token invalid"; return;}
      fetch(`${WORKER}/register?h=${hash}`);
      location.href=`myapp://open?ok=1&t=${token}&h=${hash}`;
    });
  };
})
.catch(()=>{status.innerText="❌ Gagal koneksi server";});
</script>
</body>
</html>
