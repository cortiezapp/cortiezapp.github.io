<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>License Verification</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
body{
background:#020617;
color:#fff;
font-family:system-ui;
display:flex;
align-items:center;
justify-content:center;
height:100vh;
margin:0;
}
.card{
background:#020617;
border:1px solid #1e293b;
padding:20px;
border-radius:12px;
width:100%;
max-width:380px;
}
input,button{
width:100%;
padding:12px;
margin-top:10px;
border-radius:8px;
border:1px solid #1e293b;
background:#020617;
color:#fff;
}
button{
background:#38bdf8;
color:#000;
border:none;
font-weight:700;
}
</style>
</head>
<body>

<div class="card">
<h3>🔑 Enter License Key</h3>
<input id="lic" placeholder="CORTIEZ-XXXX">
<button onclick="verify()">Verify</button>
<p id="msg"></p>
</div>

<script>
async function verify(){
 msg.textContent="Checking...";
 const r=await fetch(
  "https://cortiez-license.cyrustmods21.workers.dev/verify",
  {
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({license_key:lic.value})
  }
 );
 const j=await r.json();
 if(j.ok){
   location.href="cortiez://verify?ok=1";
 }else{
   msg.textContent="License invalid / expired";
 }
}
</script>

</body>
</html>
