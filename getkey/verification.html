<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>License Verification</title>
<style>
body{background:#020617;color:#fff;font-family:Arial;padding:20px}
input,button{width:100%;padding:12px;margin:8px 0}
</style>
</head>
<body>

<h2>🔑 License Verification</h2>
<input id="lic" placeholder="ENTER LICENSE">
<button onclick="verify()">VERIFY</button>
<p id="res"></p>

<script>
async function verify(){
  const r = await fetch("https://cortiez-license.cyrustmods21.workers.dev/verify",{
    method:"POST",
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({license:lic.value})
  });
  const j = await r.json();
  res.innerText = j.valid ? "✅ VALID - OPEN APP" : "❌ INVALID";
}
</script>

</body>
</html>
