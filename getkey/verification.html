<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Verifikasi Cortiez</title>
</head>
<body>
<h2>Verifikasi Lisensi</h2>
<input id="licenseKey" placeholder="Masukkan license key" />
<button id="verifyBtn">Aktifkan App</button>
<script>
const WORKER = "https://cortiez-license.cyrustmods21.workers.dev";

document.getElementById("verifyBtn").onclick = async () => {
  const key = document.getElementById("licenseKey").value;
  const res = await fetch(`${WORKER}/verify?key=${encodeURIComponent(key)}`);
  const data = await res.json();
  if(data.ok){
    alert("Lisensi valid! Buka aplikasi...");
    // Redirect ke app
    location.href = "myapp://open?ok=1&h="+key;
  } else {
    alert("Lisensi tidak valid / expired");
  }
};
</script>
</body>
</html>
