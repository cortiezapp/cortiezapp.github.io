<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>License Verification</title>
<style>
body{background:#020617;color:#fff;font-family:Arial;padding:20px}
input,button{width:100%;padding:10px;margin:6px 0}
</style>
</head>
<body>

<h2>🔑 Enter License Key</h2>

<input id="license" placeholder="CORTIEZ-XXXX-XXXX">
<button onclick="verify()">Verify</button>

<p id="status"></p>

<script>
const params = new URLSearchParams(location.search);
const hash = params.get("h");
const API = "https://cortiez-license.cyrustmods21.workers.dev";

async function verify(){
  status.textContent = "Checking...";
  const r = await fetch(
    `${API}/verify?license=${encodeURIComponent(license.value)}`
  );
  const j = await r.json();

  if (!j.ok){
    status.textContent = "❌ License invalid / expired";
    return;
  }

  await fetch(`${API}/register?h=${encodeURIComponent(hash)}`);

  location.href = `cortiez://open?ok=1&h=${hash}`;
}
</script>

</body>
</html>
