<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Verifikasi Perangkat</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  font-family: Arial, sans-serif;
  background: #0f172a;
  color: #fff;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  margin: 0;
}
.card {
  background: #020617;
  padding: 24px;
  border-radius: 12px;
  width: 100%;
  max-width: 360px;
  text-align: center;
  box-shadow: 0 10px 25px rgba(0,0,0,.4);
}
.timer {
  font-size: 22px;
  font-weight: bold;
  margin: 12px 0;
}
button {
  background: #22c55e;
  border: none;
  color: #000;
  padding: 12px;
  border-radius: 8px;
  font-size: 16px;
  width: 100%;
  cursor: pointer;
}
button:disabled {
  background: #555;
  cursor: not-allowed;
}
.small {
  font-size: 12px;
  color: #94a3b8;
  margin-top: 12px;
  min-height: 18px;
}
</style>
</head>

<body>
<div class="card">
  <h2>🔐 Verifikasi Perangkat</h2>
  <p>Aktifkan fitur aplikasi di perangkat ini.</p>

  <div class="timer" id="timer">--:--</div>
  <button id="verifyBtn" disabled>Verifikasi & Aktifkan</button>
  <div class="small" id="status">Memuat data…</div>
</div>

<script>
const params = new URLSearchParams(location.search);
const hash = params.get("h");

if (!hash) {
  document.body.innerHTML = "Invalid request";
  throw "";
}

const WORKER = "https://cortiezapp.cyrustmods21.workers.dev";

const btn = document.getElementById("verifyBtn");
const status = document.getElementById("status");
const timer = document.getElementById("timer");

let verifiedOnce = false;

fetch(`${WORKER}/create?h=${encodeURIComponent(hash)}`)
.then(r => r.json())
.then(d => {

  if (!d.token || !d.expire || !d.server_time) {
    status.innerText = "❌ Data server tidak valid";
    return;
  }

  const token = d.token;
  const expire = d.expire * 1000;
  const offset = Date.now() - (d.server_time * 1000);

  function tick() {
    const left = expire - (Date.now() - offset);

    if (left <= 0) {
      timer.innerText = "00:00";
      status.innerText = "⏰ Token expired";
      btn.disabled = true;
      return;
    }

    const s = Math.floor(left / 1000);
    const h = Math.floor(s / 3600);
    const m = Math.floor((s % 3600) / 60);

    timer.innerText =
      `${h.toString().padStart(2,"0")}:${m.toString().padStart(2,"0")}`;

    btn.disabled = false;
  }

  tick();
  setInterval(tick, 1000);

  btn.onclick = async () => {
    if (verifiedOnce) return;
    verifiedOnce = true;

    btn.disabled = true;
    status.innerText = "Memverifikasi…";

    try {
      const res = await fetch(
        `${WORKER}/verify?t=${encodeURIComponent(token)}&h=${encodeURIComponent(hash)}`
      );
      const json = await res.json();

      if (!json.ok) {
        status.innerText = "❌ Token tidak valid / expired";
        verifiedOnce = false;
        return;
      }

      // simpan user
      const reg = await fetch(
        `${WORKER}/register?h=${encodeURIComponent(hash)}`
      );

      if (!reg.ok) {
        status.innerText = "❌ Gagal menyimpan data user";
        verifiedOnce = false;
        return;
      }

      status.innerText = "✅ Berhasil, membuka aplikasi…";

      location.href =
        `myapp://open?ok=1&t=${token}&h=${hash}`;

    } catch (e) {
      status.innerText = "❌ Gagal koneksi server";
      verifiedOnce = false;
    }
  };
})
.catch(() => {
  status.innerText = "❌ Gagal koneksi server";
});
</script>

</body>
</html>
