
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Verifikasi Perangkat</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .card {
      background: #020617;
      padding: 24px;
      border-radius: 12px;
      width: 100%;
      max-width: 360px;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0,0,0,.4);
    }

    h2 {
      margin-top: 0;
    }

    .timer {
      font-size: 22px;
      font-weight: bold;
      margin: 12px 0;
    }

    button {
      background: #22c55e;
      border: none;
      color: #000;
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      width: 100%;
      margin-top: 16px;
    }

    button:disabled {
      background: #555;
      cursor: not-allowed;
    }

    .small {
      font-size: 12px;
      color: #94a3b8;
      margin-top: 12px;
      min-height: 18px;
    }
  </style>
</head>

<body>

<div class="card">
  <h2>🔐 Verifikasi Perangkat</h2>
  <p>Aktifkan fitur aplikasi di perangkat ini.</p>

  <div class="timer" id="timer">--:--:--</div>

  <button id="verifyBtn" disabled>Verifikasi & Aktifkan</button>

  <div class="small" id="status">Memuat data verifikasi…</div>
</div>

<script>
const params = new URLSearchParams(location.search);
const hash = params.get("h");

if (!hash) {
  document.body.innerHTML = "Invalid request";
  throw "";
}

const WORKER = "https://cortiez-verify.workers.dev";

fetch(`${WORKER}/create?h=${encodeURIComponent(hash)}`)
.then(r => r.json())
.then(d => {

  const token = d.token;
  const expire = d.expire * 1000;
  const offset = Date.now() - (d.server_time * 1000);

  const btn = document.getElementById("verifyBtn");
  const status = document.getElementById("status");

  function tick() {
    const left = expire - (Date.now() - offset);

    if (left <= 0) {
      status.innerText = "⏰ Token expired";
      btn.disabled = true;
      return;
    }

    const s = Math.floor(left / 1000);
    const h = Math.floor(s / 3600);
    const m = Math.floor((s % 3600) / 60);

    status.innerText =
      `Berlaku ${h} jam ${m} menit`;
    btn.disabled = false;
  }

  tick();
  setInterval(tick, 1000);

  btn.onclick = () => {
    location.href =
      `myapp://open?ok=1&t=${token}&h=${hash}`;
  };
});
</script>


</body>
</html>
