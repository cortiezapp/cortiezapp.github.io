<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Verification</title>
<style>
body{background:#020617;color:#fff;font-family:Arial;padding:20px}
input,button{padding:10px;width:100%;margin:6px}
</style>
</head>
<body>

<h2>🔑 License Verification</h2>
<input id="lic" placeholder="LICENSE KEY">
<button onclick="verify()">Verify</button>
<p id="res"></p>

<script>
async function verify(){
  const lic=document.getElementById("lic").value;
  const device="WEB-"+navigator.userAgent;
  const r=await fetch("https://cortiez-license.cyrustmods21.workers.dev/verify",{
    method:"POST",
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({license:lic,device})
  });
  const j=await r.json();
  document.getElementById("res").innerText=j.valid?"✅ Valid":"❌ Invalid";
}
</script>

</body>
</html>
