<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Verifikasi Perangkat</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
/* FALLBACK JIKA BUKA DI LUAR BLOGGER */
:root{
  --bodyB:#020617;
  --contentB:#020617;
  --headC:#e5e7eb;
  --linkC:#22c55e;
  --contentL:#1f2937;
  --iconC:#22c55e;
}

/* RESET */
*{box-sizing:border-box}

/* BODY */
body{
  margin:0;
  height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  background:var(--bodyB);
  color:var(--headC);
  font-family:var(--fontB,system-ui);
}

/* CARD */
.card{
  background:var(--contentB);
  width:100%;
  max-width:380px;
  padding:24px;
  border-radius:14px;
  border:1px solid var(--contentL);
  text-align:center;
  box-shadow:0 10px 40px rgba(0,0,0,.4);
}

/* TITLE */
.card h2{
  margin:0 0 8px;
  font-weight:600;
}

/* TEXT */
.card p{
  font-size:14px;
  opacity:.85;
}

/* TIMER */
.timer{
  font-size:26px;
  font-weight:700;
  margin:16px 0;
  color:var(--iconC);
}

/* BUTTON */
button{
  width:100%;
  padding:14px;
  border:none;
  border-radius:10px;
  background:var(--linkC);
  color:#000;
  font-size:15px;
  font-weight:700;
  cursor:pointer;
  transition:var(--trans-2);
}

button:disabled{
  opacity:.45;
  cursor:not-allowed;
}

/* STATUS */
.status{
  margin-top:14px;
  font-size:12px;
  min-height:18px;
  opacity:.8;
}
</style>
</head>

<body>

<div class="card">
  <h2>Verifikasi Perangkat</h2>
  <p>Aktifkan fitur aplikasi pada perangkat ini.</p>

  <div class="timer" id="timer">--:--</div>

  <button id="verifyBtn" disabled>Verifikasi & Aktifkan</button>

  <div class="status" id="status">Memuat data…</div>
</div>

<script>
const params = new URLSearchParams(location.search);
const hash = params.get("h");

if (!hash) {
  document.body.innerText = "Invalid request";
  throw "";
}

const WORKER = "https://cortiezapp.cyrustmods21.workers.dev";

const btn = document.getElementById("verifyBtn");
const timer = document.getElementById("timer");
const status = document.getElementById("status");

fetch(`${WORKER}/create?h=${encodeURIComponent(hash)}`)
.then(r => r.json())
.then(d => {

  const token = d.token;
  const expire = d.expire * 1000;
  const offset = Date.now() - (d.server_time * 1000);

  function tick(){
    const left = expire - (Date.now() - offset);

    if (left <= 0) {
      timer.textContent = "00:00";
      status.textContent = "Token kedaluwarsa";
      btn.disabled = true;
      return;
    }

    const s = Math.floor(left / 1000);
    const m = Math.floor((s % 3600) / 60);
    const h = Math.floor(s / 3600);

    timer.textContent =
      h.toString().padStart(2,"0") + ":" +
      m.toString().padStart(2,"0");

    btn.disabled = false;
  }

  tick();
  setInterval(tick, 1000);

  btn.onclick = async () => {
    btn.disabled = true;
    status.textContent = "Memverifikasi…";

    const res = await fetch(
      `${WORKER}/verify?t=${token}&h=${hash}`
    );
    const json = await res.json();

    if (!json.ok) {
      status.textContent = "Verifikasi gagal / expired";
      return;
    }

    status.textContent = "Berhasil, membuka aplikasi…";
    location.href = `myapp://open?ok=1&t=${token}&h=${hash}`;
  };
})
.catch(()=>{
  status.textContent = "Gagal koneksi server";
});
</script>

</body>
</html>
