<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex,nofollow">
<title>Cortiez Time API</title>
</head>
<body>
<pre id="out"></pre>

<script>
(function () {
  const now = new Date();

  const wib = new Date(
    now.toLocaleString("en-US", {
      timeZone: "Asia/Jakarta"
    })
  );

  const data = {
    status: "success",
    api: "cortiez-time",
    version: "1.0",
    timezone: "Asia/Jakarta",
    timestamp: wib.getTime(),
    unix: Math.floor(wib.getTime() / 1000),
    iso: wib.toISOString(),
    wib: wib.toLocaleString("id-ID")
  };

  document.getElementById("out").textContent =
    JSON.stringify(data);
})();
</script>
</body>
</html>
